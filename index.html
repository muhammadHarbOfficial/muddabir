<!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="./images/favicon.png" type="image/png">
        <title>مدبّر</title>
        <link rel="stylesheet" href="./css/all.min.css">
        <link rel="stylesheet" href="./css/main.css">
        <link rel="stylesheet" href="./css/media.css" >
    </head>
    <body>
        
        <!--? Start Side Bar -->

        <div class="sidebar">
            <div class="sidebar-inner d-flex flex-col">
                <div class="logo d-flex align-items-center">
                    <div class="logo-icon d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                    <div class="logo-text">
                        <h1>مدبّر</h1>
                        <p>إدارة أموالك بذكاء</p>
                    </div>
                </div>

                <div class="nav">
                    <ul class="d-flex flex-col">
                        <li class="active">
                            <i class="fa-solid fa-house"></i>
                            <span>الصفحة الرئيسية</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                            <span>المعاملات</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-chart-pie"></i>
                            <span>الميزانيات</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-piggy-bank"></i>
                            <span>المدخرات</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-file-invoice-dollar"></i>
                            <span>الفواتير الشهرية</span>
                        </li>
                    </ul>
                </div>

                <div class="quick-actions">
                    <h3>اجراءات سريعة</h3>
                    <div class="quick-buttons d-flex flex-col">
                        <button class="sidebar-action-btn">
                            <span class="sidebar-action-icon bg-blue">
                                <i class="fa-solid fa-paper-plane"></i>
                            </span>
                            <span class="sidebar-action-text">ارسال أموال</span>
                        </button>
                        <button class="sidebar-action-btn">
                            <span class="sidebar-action-icon bg-green">
                                <i class="fa-solid fa-plus"></i>
                            </span>
                            <span class="sidebar-action-text">اضافة اموال</span>
                        </button>
                        <button class="sidebar-action-btn">
                            <span class="sidebar-action-icon bg-purple">
                                <i class="fa-solid fa-receipt"></i>
                            </span>
                            <span class="sidebar-action-text">دفع فاتورة</span>
                        </button>
                        <button class="sidebar-action-btn">
                            <span class="sidebar-action-icon bg-orange">
                                <i class="fa-solid fa-chart-line"></i>
                            </span>
                            <span class="sidebar-action-text">استثمار</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!--? End Side Bar -->
        <div class="container">
            <div class="header">مدبّر</div>
            <div class="current-balance">2</div>
            <div class="income-card">current-balance</div>
            <div class="expenses-card">expenses-card</div>
            <div class="dashboard-widget">dashboard-widget</div>
            <div class="bills-card">bills-card</div>
            <div class="transaction-card">transaction-card</div>
            <div class="budget-overview-card">udget-overview-card</div>
            <div class="income-vs-expenses-card">income-vs-expenses-card</div>
            <div class="account-summary-card">account-summary-card</div>
            <div class="payments-card">payments-card</div>
        </div>
        

    </body>
</html>
